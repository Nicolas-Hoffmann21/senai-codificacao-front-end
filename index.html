<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Loja</title>
</head>
<body>

    <header>
        <h1>Mini Loja</h1>
    </header>

    <main>
        <section>
            <h2>Produtos em Destaque</h2>

            <figure>
                <img 
                    src="img/iphone.jpg" 
                    alt="Smartphone laranja visto de frente e de costas" 
                    width="250" 
                    height="250" 
                    loading="lazy"
                >
                <figcaption>Smartphone Laranja - R$ 4.999,00</figcaption>
            </figure>

            <figure>
                <img 
                    src="img/camisa.jpg" 
                    alt="Camiseta branca de manga curta e gola redonda" 
                    width="250" 
                    height="250" 
                    loading="lazy"
                >
                <figcaption>Camiseta Branca Básica - R$ 59,90</figcaption>
            </figure>
        </section>

        <section>
            <h2>Vídeo de Apresentação</h2>
            <video width="400" controls preload="metadata">
                <source src="img/video.mp4" type="video/mp4">
                Seu navegador não suporta a exibição deste vídeo, troque de navegador ou atualize para a versão mais recente.
            </video>
        </section>

        <section>
            <h2>Descrição em Áudio</h2>
            <audio controls preload="metadata">
                <source src="img/descricao-produto.mp3" type="audio/mpeg">
                Seu navegador não suporta a reprodução de áudio, troque de navegador ou atualize para a versão mais recente.
            </audio>
        </section>

        
    </main>

    <footer>
        <p>Desenvolvido por: Nicolas Hoffmann e Jhuly Salles</p>
    </footer>

</body>
</html>

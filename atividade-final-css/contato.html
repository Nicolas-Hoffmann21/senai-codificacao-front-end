<!DOCTYPE html>

<body>

  <header id="topo">
    <h1>Easter Eggs de Games</h1>
    <nav>
      <ul>
        <li><a href="index.html">Início</a></li>
        <li><a href="servicos.html">Serviços</a></li>
        <li><a href="galeria.html">Galeria</a></li>
        <li><a href="contato.html">Contato</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <h2>Envie seu Segredo ou Dúvida</h2>
    <p>Encontrou um easter egg novo? Fale conosco!</p>

    <form action="#" method="post">
      <label for="nome">Nome:</label>
      <input type="text" id="nome" name="nome" placeholder="Seu nome" required>

      <label for="email">E-mail:</label>
      <input type="email" id="email" name="email" placeholder="seu@email.com" required>

      <label for="mensagem">Mensagem / Easter Egg encontrado:</label>
      <textarea id="mensagem" name="mensagem" rows="5" placeholder="Descreva o segredo..." required></textarea>

      <button type="submit" class="botao">Enviar Mensagem</button>
    </form>
  </main>

  <footer>
    <p>&copy; 2026 Easter Eggs de Games — Nicolas & Jhuly</p>
  </footer>
